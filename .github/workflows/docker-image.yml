name: Build and Push Docker Image (Release)

on:
  push:
    tags:
      - 'v*.*.*'  # Only trigger on version tags like v1.0.0, v2.1.3, etc.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish without the leading v (e.g. 2.7.0 or 2.7.0-dev)'
        required: true
        type: string

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Docker Hub credentials live in this GitHub Environment's secrets.
    environment: Docker Build
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags and metadata
        id: meta
        run: |
          # Version comes from the tag (v prefix stripped) or the manual dispatch input.
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "aerofoil_version=v$VERSION" >> "$GITHUB_OUTPUT"
          
          # Extract major and minor versions for additional tags
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f1-2)
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"

          # SHA tag
          echo "sha_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

          # Pre-release tags (e.g. v2.7.0-dev) publish only the exact version
          # and SHA tags; latest/major/minor stay pointing at stable releases.
          TAGS="freefrank/aerofoil:${VERSION}"$'\n'"freefrank/aerofoil:sha-${GITHUB_SHA::7}"
          if [[ "$VERSION" != *-* ]]; then
            TAGS="$TAGS"$'\n'"freefrank/aerofoil:latest"$'\n'"freefrank/aerofoil:${MAJOR}"$'\n'"freefrank/aerofoil:${MINOR}"
          fi
          {
            echo "tags<<TAGS_EOF"
            echo "$TAGS"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            AEROFOIL_VERSION=${{ steps.meta.outputs.aerofoil_version }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Build Summary
        if: success()
        run: |
          echo "## ✅ Docker Release Build Successful! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎉 Release Version: \`v${{ steps.meta.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Published Images:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          while IFS= read -r tag; do
            [ -n "$tag" ] && echo "- \`$tag\`" >> $GITHUB_STEP_SUMMARY
          done <<'TAGS_LIST_EOF'
          ${{ steps.meta.outputs.tags }}
          TAGS_LIST_EOF
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🏗️ Build Details:" >> $GITHUB_STEP_SUMMARY
          echo "- **Platforms**: linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Released by**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Pull Commands:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "# Pull latest" >> $GITHUB_STEP_SUMMARY
          echo "docker pull freefrank/aerofoil:latest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Pull specific version" >> $GITHUB_STEP_SUMMARY
          echo "docker pull freefrank/aerofoil:${{ steps.meta.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Build Failed Notification
        if: failure()
        run: |
          echo "## ❌ Docker Release Build Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release**: \`v${{ steps.meta.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The build failed. Please check the logs above for details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Common issues:**" >> $GITHUB_STEP_SUMMARY
          echo "- Docker Hub credentials expired or incorrect" >> $GITHUB_STEP_SUMMARY
          echo "- Dockerfile syntax errors" >> $GITHUB_STEP_SUMMARY
          echo "- Build failures in the application code" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub Actions runner issues (try re-running)" >> $GITHUB_STEP_SUMMARY
